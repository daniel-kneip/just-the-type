name: Publish

on:
  release:
    types: [published] # stable -> "latest"
  workflow_dispatch: # prerelease -> "next"

permissions:
  contents: read

jobs:
  # Runs untrusted dependency code (install scripts, tests). Deliberately has
  # NO id-token, so a compromised dependency cannot mint an OIDC token.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 1

  # Publishes the prebuilt artifact via OIDC trusted publishing. Installs no
  # dependencies and runs no lifecycle scripts, so the id-token is only present
  # while our own, trusted commands run.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # Trusted publishing (OIDC) requires npm >= 11.5.1.
      - run: npm install -g npm@latest

      - name: Resolve dist-tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            # Stable release: publish the version from package.json as-is.
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            # Manual prerelease: package.json version + unique suffix, kept off "latest".
            base="$(node -p "require('./package.json').version")"
            npm version "${base}-next.${{ github.run_number }}" --no-git-tag-version
            echo "tag=next" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        run: npm publish --tag ${{ steps.meta.outputs.tag }} --access public --ignore-scripts
